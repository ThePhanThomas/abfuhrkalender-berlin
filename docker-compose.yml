services:
  abfuhrkalender:
    build: .
    container_name: abfuhrkalender
    restart: unless-stopped
    # Unter welchem Benutzer die App läuft. Muss zum Besitzer des Ordners
    # data/ passen, sonst kann sie dort nichts speichern. Werte kommen aus .env
    # (PUID/PGID), ohne Angabe 1000:1000.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data
